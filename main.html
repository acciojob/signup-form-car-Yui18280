<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->
    <script type="text/javascript" src="./script.js">
</script>
<form>
	<label for="name">
	Name:<input id="name" type="text" placeholder="Name" required>	
	</label>
	<br>
	<br>
	<label for="email">

	Email:<input id="email" type="email" placeholder="Email" required>
	</label>
	<br>
	<br>
	Gender:
	<label for="gender_m">

		
    Male:<input id="gender_m" type="radio" name="Gender" value="male" required>
	
		</label>
	<label for="gender_f">
		Female:<input id="gender_f" type="radio" name="Gender" value="female" required>
	</label>
	<br>
	<br>
	<label for="cars">
	Cars:<input id="cars" type="select" placeholder="Please choose an option"	required>
	</label>
	<br>
	<br>
	<label for="age">

    Age:<input id="age" type="number" placeholder="Age" required>		
	</label>
	<br>
	<br>
	<label for="dob">
    DOB:<input id="dob" type="date" required>
	</label>
	<br>
	<br>
	<label for="tel">

	Phone number:<input id="tel" type="tel" placeholder="xxx-xxx-xxxx" required>	
	</label>
	<br>
	<br>
	<label for="password">
    Password:<input id="password" type="password" required>
	</label>
	<br>
	<br>
	<label for="tos">

	I agree to the toss:<input id="tos" type="checkbox" required>	
		
	</label>
</form>
</body>

</html>
